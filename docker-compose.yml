version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: transcendence_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-transcendence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  redis:
    image: redis:7-alpine
    container_name: transcendence_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  backend:
    build:
      context: ./transcendence_backend
      dockerfile: Dockerfile
    container_name: transcendence_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/transcendence}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-secret_jwt_key}
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      FT_CALLBACK_URL: ${FT_CALLBACK_URL}
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  frontend:
    build:
      context: ./transcendence_frontend
      dockerfile: Dockerfile
    container_name: transcendence_frontend
    ports:
      - "8080:80"
    networks:
      - transcendence_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: transcendence_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - transcendence_net

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: transcendence_node_exporter
    ports:
      - "9100:9100"
    networks:
      - transcendence_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: transcendence_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - transcendence_net

volumes:
  pgdata:
  redisdata:
  backend_uploads:
  grafanadata:

networks:
  transcendence_net:
    driver: bridge
