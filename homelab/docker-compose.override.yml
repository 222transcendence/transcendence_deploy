services:
  # Only nginx keeps a host port published — it's the single thing the router
  # forwards 80/443 to. Everything else talks over the internal
  # transcendence_net docker network, so pin their host bindings to
  # 127.0.0.1 (still reachable from the Z2 mini itself for debugging, not
  # from the internet even if the router's NAT/UPnP is misconfigured).
  # `!override` is required: Compose concatenates `ports:` lists between base
  # and override files by default rather than replacing them, so without it
  # the root docker-compose.yml's 0.0.0.0 bindings stay published alongside
  # these — defeating the whole point (confirmed live: db was reachable on
  # 0.0.0.0:5432 even with this override applied, before !override was added).
  db:
    ports: !override
      - "127.0.0.1:15432:5432"
  redis:
    ports: !override
      - "127.0.0.1:16379:6379"
  backend:
    ports: !override
      - "127.0.0.1:13000:3000"
  frontend:
    ports: !override
      - "127.0.0.1:18080:80"
  node-exporter:
    ports: !override
      - "127.0.0.1:19100:9100"

  prometheus:
    ports: !override
      - "127.0.0.1:19090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.route-prefix=/prometheus/"
      - "--web.external-url=https://acidrain.hijae.dev/prometheus/"

  grafana:
    ports: !override
      - "127.0.0.1:13001:3000"
    environment:
      GF_SERVER_ROOT_URL: https://acidrain.hijae.dev/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  nginx:
    volumes:
      - ./homelab/nginx-homelab.conf:/etc/nginx/nginx.conf:ro
