services:
  # Only nginx keeps a host port published — it's the single thing the router
  # forwards 80/443 to. Everything else talks over the internal
  # transcendence_net docker network, so pin their host bindings to
  # 127.0.0.1 (still reachable from the Z2 mini itself for debugging, not
  # from the internet even if the router's NAT/UPnP is misconfigured).
  db:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  backend:
    ports:
      - "127.0.0.1:3000:3000"
  frontend:
    ports:
      - "127.0.0.1:8080:80"
  node-exporter:
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.route-prefix=/prometheus/"
      - "--web.external-url=https://acidrain.hijae.dev/prometheus/"

  grafana:
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SERVER_ROOT_URL: https://acidrain.hijae.dev/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  nginx:
    volumes:
      - ./homelab/nginx-homelab.conf:/etc/nginx/nginx.conf:ro
