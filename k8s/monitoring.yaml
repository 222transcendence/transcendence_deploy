apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcendence-prometheus
  namespace: public
  labels: { app: transcendence-monitoring, component: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transcendence-monitoring, component: prometheus }
  template:
    metadata:
      labels: { app: transcendence-monitoring, component: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          # Served under /prometheus/ on the same host/Ingress as the app —
          # no separate subdomain, so route-prefix + external-url must agree
          # with the Ingress path below.
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.route-prefix=/prometheus/"
            - "--web.external-url=https://acidrain.hijae.dev/prometheus/"
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap: { name: transcendence-prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: transcendence-prometheus
  namespace: public
spec:
  selector: { app: transcendence-monitoring, component: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcendence-grafana
  namespace: public
  labels: { app: transcendence-monitoring, component: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transcendence-monitoring, component: grafana }
  template:
    metadata:
      labels: { app: transcendence-monitoring, component: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: transcendence-env, key: GRAFANA_ADMIN_USER } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: transcendence-env, key: GRAFANA_ADMIN_PASSWORD } }
            # Served under /grafana/ on the same host/Ingress as the app —
            # must match the Ingress path below.
            - name: GF_SERVER_ROOT_URL
              value: "https://acidrain.hijae.dev/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: grafanadata
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: datasources.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/json/transcendence-overview.json
              subPath: transcendence-overview.json
            - name: provisioning
              mountPath: /etc/grafana/provisioning/alerting/contactpoints.yml
              subPath: contactpoints.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/alerting/policies.yml
              subPath: policies.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/alerting/rules.yml
              subPath: rules.yml
      volumes:
        - name: grafanadata
          persistentVolumeClaim: { claimName: transcendence-grafanadata }
        - name: provisioning
          configMap: { name: transcendence-grafana-provisioning }
---
apiVersion: v1
kind: Service
metadata:
  name: transcendence-grafana
  namespace: public
spec:
  selector: { app: transcendence-monitoring, component: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
