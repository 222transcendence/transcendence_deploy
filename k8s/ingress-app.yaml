apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transcendence
  namespace: public
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"   # TLS terminated at Cloudflare
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Long-lived Socket.IO connections need generous timeouts — default (~60s)
    # would drop idle game sockets.
spec:
  ingressClassName: nginx
  rules:
    # Replace with your own hostname.
    - host: acidrain.hijae.dev
      http:
        paths:
          # Mirrors nginx/nginx.conf's location blocks: /api, /uploads, /ws/,
          # /socketio/ go to backend, everything else (/) goes to frontend.
          - path: /api
            pathType: Prefix
            backend: { service: { name: transcendence-backend, port: { number: 3000 } } }
          - path: /uploads
            pathType: Prefix
            backend: { service: { name: transcendence-backend, port: { number: 3000 } } }
          - path: /ws/
            pathType: Prefix
            backend: { service: { name: transcendence-backend, port: { number: 3000 } } }
          - path: /socketio/
            pathType: Prefix
            backend: { service: { name: transcendence-backend, port: { number: 3000 } } }
          # Grafana/Prometheus live on the same host under a subpath instead of
          # their own subdomains — only one Cloudflare Tunnel Public Hostname
          # (acidrain.hijae.dev) is needed. No path rewriting here: both apps
          # are configured (k8s/monitoring.yaml) to know their own subpath via
          # GF_SERVER_ROOT_URL/SERVE_FROM_SUB_PATH and --web.route-prefix, so
          # the prefix is forwarded through unchanged.
          - path: /grafana
            pathType: Prefix
            backend: { service: { name: transcendence-grafana, port: { number: 3000 } } }
          - path: /prometheus
            pathType: Prefix
            backend: { service: { name: transcendence-prometheus, port: { number: 9090 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: transcendence-frontend, port: { number: 80 } } }
