apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcendence-redis
  namespace: public
  labels: { app: transcendence, component: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transcendence, component: redis }
  template:
    metadata:
      labels: { app: transcendence, component: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - name: redisdata
              mountPath: /data
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redisdata
          persistentVolumeClaim: { claimName: transcendence-redisdata }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: public
spec:
  selector: { app: transcendence, component: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
