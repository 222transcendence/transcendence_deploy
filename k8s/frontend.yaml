apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcendence-frontend
  namespace: public
  labels: { app: transcendence, component: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transcendence, component: frontend }
  template:
    metadata:
      labels: { app: transcendence, component: frontend }
    spec:
      containers:
        - name: frontend
          # Bump this tag as part of the release commit — keep in sync with the
          # git tag this k8s/ snapshot ships with (see k8s/README.md).
          image: transcendence-frontend:v0.0.11
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  # Namespaced with a transcendence- prefix on purpose: this cluster's `public`
  # namespace is shared with other personal projects (e.g. gs42stat), which
  # already owned the generic names `backend`/`frontend` — reusing them here
  # once silently hijacked those Services' selectors via `kubectl apply`.
  name: transcendence-frontend
  namespace: public
spec:
  selector: { app: transcendence, component: frontend }
  ports: [{ port: 80, targetPort: 80 }]
