apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transcendence-grafana
  namespace: public
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # Replace with your own hostname.
    - host: grafana.acidrain.hijae.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: transcendence-grafana, port: { number: 3000 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transcendence-prometheus
  namespace: public
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Prometheus has no built-in login (unlike Grafana) — Basic Auth is the only
    # protection once this is publicly exposed. Remove these 3 annotations to
    # disable it (see k8s/README.md / the personal runbook for the full toggle).
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus - Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    # Replace with your own hostname.
    - host: prometheus.acidrain.hijae.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: transcendence-prometheus, port: { number: 9090 } } }
