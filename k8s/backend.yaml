apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcendence-backend
  namespace: public
  labels: { app: transcendence, component: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transcendence, component: backend }
  template:
    metadata:
      labels: { app: transcendence, component: backend }
    spec:
      containers:
        - name: backend
          # Bump this tag as part of the release commit — keep in sync with the
          # git tag this k8s/ snapshot ships with (see k8s/README.md).
          image: transcendence-backend:v0.0.7
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@db:5432/$(DB_NAME)"
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - secretRef: { name: transcendence-env }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: transcendence-uploads }
---
apiVersion: v1
kind: Service
metadata:
  # Namespaced with a transcendence- prefix on purpose: this cluster's `public`
  # namespace is shared with other personal projects (e.g. gs42stat), which
  # already owned the generic names `backend`/`frontend` — reusing them here
  # once silently hijacked those Services' selectors via `kubectl apply`.
  name: transcendence-backend
  namespace: public
spec:
  selector: { app: transcendence, component: backend }
  ports: [{ port: 3000, targetPort: 3000 }]
