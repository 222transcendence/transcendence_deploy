services:
  backend:
    environment:
      FT_CALLBACK_URL: ${FT_CALLBACK_URL:-https://localhost:8443/api/auth/42/callback}

    ports: !override
      - "${BACKEND_HOST_PORT:-3000}:3000"

  db:
    ports: !override
      - "${DB_HOST_PORT:-5432}:5432"

  redis:
    ports: !override
      - "${REDIS_HOST_PORT:-6380}:6379"

  frontend:
    ports: !override
      - "${FRONTEND_HOST_PORT:-8081}:80"

  nginx:
    ports: !override
      - "${HTTP_HOST_PORT:-8080}:80"
      - "${HTTPS_HOST_PORT:-8443}:443"

  prometheus:
    ports: !override
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  node-exporter:
    ports: !override
      - "${NODE_EXPORTER_HOST_PORT:-9101}:9100"

  grafana:
    ports: !override
      - "${GRAFANA_HOST_PORT:-3001}:3000"
